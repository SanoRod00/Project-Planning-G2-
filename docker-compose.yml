services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharijavuba
      POSTGRES_USER: sharijavuba
      POSTGRES_PASSWORD: sharijavuba
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  localstack:
    image: localstack/localstack:latest
    environment:
      SERVICES: sqs,lambda,sns
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"

volumes:
  postgres-data:
